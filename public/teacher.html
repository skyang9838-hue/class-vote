<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 반 투표 · 선생님</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;800&display=swap">
<link rel="stylesheet" href="/style.css?v=2">
<style>
  .panel { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:16px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  .panel label { display:flex; gap:8px; align-items:center; font-weight:800; }
  .nums { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .nums span { width:38px; height:38px; display:grid; place-items:center; border-radius:10px; background:var(--card); border:1px solid var(--line); font-weight:800; }
  .nums span.on { background:var(--good); color:var(--bg); border-color:var(--good); }
  .row { cursor:default; }
  .row.pickable { cursor:pointer; }
  .hist { margin-top:24px; color:var(--sub); }
  .hist li { margin:6px 0 0 20px; }
  .join { font-size:clamp(20px, 3vw, 30px); font-weight:800; }
  .join b { color:var(--acc); }
  .card .x { position:absolute; top:6px; right:6px; width:30px; height:30px; padding:0; border-radius:8px; background:rgba(0,0,0,.65); color:#fff; font-size:16px; z-index:2; }
  .card.ed { cursor:pointer; }
  .card.ed.on { border-color:var(--acc); }
  .card .name[contenteditable] { outline:none; cursor:text; }
  .card.add { border:3px dashed var(--line); background:transparent; min-height:160px; justify-content:center; align-items:center; gap:10px; padding:12px; }
  .card.add input { width:100%; text-align:center; }
  .hint { color:var(--sub); font-size:15px; margin-top:8px; }
  .topicin { font-size:20px; width:min(420px, 100%); }
  .who { margin-top:16px; display:grid; gap:8px; }
  .who .wr { display:flex; gap:12px; align-items:baseline; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 14px; font-size:20px; }
  .who .wr b { min-width:120px; flex:none; }
  .who .wr span { font-weight:800; word-break:keep-all; }
  .who .wr.none { opacity:.6; }
  .hidden-note { margin-top:16px; color:var(--sub); font-size:18px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const app = document.getElementById("app");
let key = null;
try { key = new URLSearchParams(location.search).get("key") || localStorage.getItem("vote-key"); } catch {}
let st = null, err = "", editing = false, draft = [];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const img = (u) => `background-image:url('${encodeURI(u)}')`;
const joinUrl = location.origin;
const JOIN = "is.gd/vote63";
let selId = null; // 사진을 붙여 넣을 카드
// TV에 띄울 때 결과·번호별 선택을 숨길 수 있다 (이 브라우저에만 기억)
let showRes = true, showWho = false;
try { showRes = localStorage.getItem("vote-show-res") !== "0"; showWho = localStorage.getItem("vote-show-who") === "1"; } catch {}
function saveView() { try { localStorage.setItem("vote-show-res", showRes ? "1" : "0"); localStorage.setItem("vote-show-who", showWho ? "1" : "0"); } catch {} }

async function admin(action, extra = {}) {
  err = "";
  const res = await fetch("/api/admin", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action, key, ...extra }) });
  const d = await res.json();
  if (!res.ok) err = d.error || "실패";
  return d;
}

async function first() {
  const pub = await (await fetch("/api/state")).json();
  if (pub.ready && !pub.hasPin) {
    app.innerHTML = `<div class="center"><h1>우리 반 투표 · <span>선생님</span></h1>
      <div class="big">선생님 비밀번호를 정해 주세요</div><p class="sub">4자 이상. 이 브라우저는 기억해요</p>
      <input id="k" type="password" style="width:260px;text-align:center"><button id="go">정하기</button><span class="err" id="e"></span></div>`;
    document.getElementById("go").onclick = async () => {
      const d = await admin("setpin", { pin: document.getElementById("k").value.trim() });
      if (d.key) { key = d.key; save(); load(); } else document.getElementById("e").textContent = err;
    };
    return;
  }
  if (pub.ready && !key) {
    app.innerHTML = `<div class="center"><h1>우리 반 투표 · <span>선생님</span></h1>
      <div class="big">선생님 비밀번호</div>
      <input id="k" type="password" style="width:260px;text-align:center"><button id="go">들어가기</button></div>`;
    const go = () => { key = document.getElementById("k").value.trim(); save(); load(); };
    document.getElementById("go").onclick = go;
    document.getElementById("k").onkeydown = (e) => { if (e.key === "Enter") go(); };
    return;
  }
  if (!pub.ready) {
    app.innerHTML = `<div class="center"><h1>우리 반 투표 · <span>선생님</span></h1>
      <div class="big">무엇을 정하나요? <span class="hint">(안 써도 돼요)</span></div><input id="tp" class="topicin" placeholder="예: 현장체험 장소" style="text-align:center">
      <div class="big">마지막 번호</div><input id="t" type="number" value="25" style="width:120px;text-align:center;font-size:28px">
      <div class="big">선생님 비밀번호</div><input id="p" type="password" style="width:200px;text-align:center">
      <button id="mk">투표 만들기</button></div>`;
    document.getElementById("mk").onclick = async () => {
      const d = await admin("create", { total: Number(document.getElementById("t").value), pin: document.getElementById("p").value.trim() });
      if (d.key) { key = d.key; save(); await admin("topic", { topic: document.getElementById("tp").value }); load(); return; }
      if (d.key) { key = d.key; save(); load(); } else alert(err);
    };
    return;
  }
  load();
}
function save() { try { localStorage.setItem("vote-key", key); } catch {} }

async function load() {
  const res = await fetch("/api/admin-state?key=" + encodeURIComponent(key));
  if (!res.ok) { key = null; try { localStorage.removeItem("vote-key"); } catch {} return first(); }
  st = await res.json();
  render();
}

function results(r) {
  const counts = st.counts;
  const alive = st.items.filter((i) => st.alive.includes(i.id));
  const max = Math.max(1, ...Object.values(counts));
  const p = r.proposal;
  return `<div class="res">` + alive.slice().sort((a, b) => counts[b.id] - counts[a.id]).map((it) => {
    const cls = [r.mode === "exclude" ? "ex" : "", p ? (p.survivors.includes(it.id) ? "keep pickable" : "out pickable") : ""].join(" ");
    const tie = p && p.ties.includes(it.id) ? " <span style='color:var(--acc);font-size:15px'>동점</span>" : "";
    return `<div class="row ${cls}" data-id="${it.id}"><div class="thumb" style="${img(it.img)}"></div><div class="nm">${esc(it.name)}${tie}</div>
      <div class="track"><div class="fill" style="width:${(counts[it.id] / max) * 100}%"></div></div><div class="ct">${counts[it.id]}</div></div>`;
  }).join("") + `</div>`;
}

// 번호별 선택: 항목마다 고른 번호, 맨 끝에 안 낸 번호
function whoPicked() {
  const votes = st.votes || {};
  const alive = st.items.filter((i) => st.alive.includes(i.id));
  const by = Object.fromEntries(alive.map((i) => [i.id, []]));
  for (const [num, ids] of Object.entries(votes)) for (const id of ids || []) if (by[id]) by[id].push(Number(num));
  const none = Array.from({ length: st.total + 1 }, (_, i) => i).filter((k) => !votes[k]);
  const list = (a) => a.length ? a.sort((x, y) => x - y).join(", ") : "—";
  return `<div class="who">` + alive.map((it) => `<div class="wr"><b>${esc(it.name || "(이름 없음)")}</b><span>${list(by[it.id])}</span></div>`).join("")
    + `<div class="wr none"><b>안 냄</b><span>${list(none)}</span></div></div>`;
}

function renderEdit() {
  app.innerHTML = `<h1>투표 <span>항목</span> 고치기</h1>
    <p class="sub">이름은 꼭, 사진 주소·쇼핑몰 주소는 있으면 넣어요. 새 항목은 남은 후보에 들어가요.</p>
    <div id="rows">${draft.map((it, i) => `<div class="panel ed" data-i="${i}" style="margin-bottom:10px">
      <div class="thumb" style="${it.img ? img(it.img) : ""};width:56px;height:56px;border-radius:10px;background-size:cover;background-position:center;background-color:#2a2d36"></div>
      <input data-k="name" placeholder="이름" value="${esc(it.name)}" style="width:160px">
      <input data-k="img" placeholder="사진 주소" value="${esc(it.img)}" style="flex:1;min-width:180px">
      <input data-k="url" placeholder="쇼핑몰 주소" value="${esc(it.url)}" style="flex:1;min-width:180px">
      <button class="ghost" data-del="${i}">지우기</button></div>`).join("")}</div>
    <div class="panel"><button class="ghost" id="add">+ 항목 추가</button><button id="savei">저장</button><button class="ghost" id="cancel">취소</button><span class="err">${esc(err)}</span></div>`;
  const sync = () => app.querySelectorAll(".ed").forEach((row) => { const it = draft[row.dataset.i]; row.querySelectorAll("input").forEach((inp) => it[inp.dataset.k] = inp.value); });
  app.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => { sync(); draft.splice(Number(b.dataset.del), 1); renderEdit(); });
  document.getElementById("add").onclick = () => { sync(); draft.push({ id: "", name: "", img: "", url: "" }); renderEdit(); };
  document.getElementById("cancel").onclick = () => { editing = false; err = ""; render(); };
  document.getElementById("savei").onclick = async () => { sync(); await admin("items", { items: draft }); if (!err) { editing = false; await load(); } else renderEdit(); };
}

// 사진을 줄여 jpeg 글자로 바꾼다 (긴 변 480px)
function shrink(file) {
  return new Promise((ok, no) => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 480 / Math.max(im.width, im.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
      const g = cv.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height);
      g.drawImage(im, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(im.src);
      ok(cv.toDataURL("image/jpeg", 0.85));
    };
    im.onerror = no;
    im.src = URL.createObjectURL(file);
  });
}

function bindEdit() {
  const tp = document.getElementById("topic");
  if (tp) tp.onchange = async () => { await admin("topic", { topic: tp.value }); };
  const an = document.getElementById("addname");
  if (an) an.onkeydown = async (e) => {
    if (e.key !== "Enter" || e.isComposing) return;
    // 여러 줄을 붙여 넣었으면 줄마다 하나씩
    const names = an.value.split(/\n|\t/).map((x) => x.trim()).filter(Boolean);
    if (!names.length) return;
    for (const nm of names) await admin("additem", { name: nm });
    await load();
    const a2 = document.getElementById("addname"); if (a2) a2.focus();
  };
  if (an) an.addEventListener("paste", (e) => {
    const txt = e.clipboardData.getData("text");
    if (txt && /\n/.test(txt.trim())) { e.preventDefault(); an.value = txt; an.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter" })); }
  });
  app.querySelectorAll("[data-del]").forEach((b) => b.onclick = async (e) => {
    e.stopPropagation();
    if (selId === b.dataset.del) selId = null;
    await admin("delitem", { id: b.dataset.del }); await load();
  });
  app.querySelectorAll("[data-ren]").forEach((el) => {
    el.onclick = (e) => e.stopPropagation();
    el.onkeydown = (e) => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); el.blur(); } };
    el.onblur = async () => { const it = st.items.find((i) => i.id === el.dataset.ren); if (it && it.name !== el.textContent.trim()) { await admin("renitem", { id: it.id, name: el.textContent }); await load(); } };
  });
  app.querySelectorAll(".card.ed").forEach((c) => c.onclick = () => { selId = selId === c.dataset.id ? null : c.dataset.id; render(); });
}

// Ctrl+V: 고른 카드에 사진 넣기, 안 골랐으면 새 항목
document.addEventListener("paste", async (e) => {
  if (!st || st.round || editing) return;
  const file = [...(e.clipboardData.items || [])].find((i) => i.type.startsWith("image/"));
  if (!file) return;
  e.preventDefault();
  let data;
  try { data = await shrink(file.getAsFile()); } catch { err = "사진을 못 읽었어요"; return render(); }
  if (selId && st.items.some((i) => i.id === selId)) await admin("imgitem", { id: selId, img: data });
  else await admin("additem", { name: "", img: data });
  await load();
});

function render() {
  if (editing) return renderEdit();
  const r = st.round;
  const alive = st.items.filter((i) => st.alive.includes(i.id));
  const n = alive.length;
  let html = `<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end">
    <h1>우리 반 <span>투표</span> 🗳️${!r ? `<div><input id="topic" class="topicin" placeholder="무엇을 정하나요? (눌러서 쓰기)" value="${esc(st.topic || "")}"></div>` : st.topic ? `<div class="topic">${esc(st.topic)}</div>` : ""}</h1>
    <div class="join">입장: <b>${JOIN}</b> → 번호 입력</div></div>`;

  if (n === 1 && !r && st.history.length) {
    const w = alive[0];
    html += `<div class="center"><div class="big">🎉 1등은</div>
      <div class="card ${w.img ? "" : "noimg"}" style="width:min(360px,80vw)">${w.img ? `<div class="img" style="${img(w.img)}"></div>` : ""}<div class="name" style="font-size:32px">${esc(w.name)}</div></div>
      <button id="announce">${st.announced ? "아이들 화면에서 가리기" : "📣 아이들에게 발표하기"}</button>
      <p class="sub">${st.announced ? "아이들 화면에 1등이 떠 있어요" : "아직 아이들 화면에는 안 보여요"}</p></div>`;
  } else if (!r) {
    // 다음 라운드 설정. 남은 수에 맞춰 기본값을 고른다 (8→5 제외, 5→2 선택, 2→1 양자택일)
    const defMode = n > 5 ? "exclude" : "pick";
    const defKeep = n > 5 ? n - 3 : n > 2 ? 2 : 1;
    const defPicks = n > 5 ? 3 : 1;
    html += `<p class="sub">남은 항목 ${n}개 · ${st.roundNo + 1}라운드 준비</p>
      <div class="panel">
        <label>방식 <select id="mode"><option value="exclude" ${defMode === "exclude" ? "selected" : ""}>빼고 싶은 것 고르기 (제외 투표)</option><option value="pick" ${defMode === "pick" ? "selected" : ""}>좋은 것 고르기</option></select></label>
        <label>한 명이 <input id="picks" type="number" min="1" max="${n - 1}" value="${defPicks}" style="width:70px">개 고르기</label>
        <label>끝나면 <input id="keep" type="number" min="1" max="${n - 1}" value="${defKeep}" style="width:70px">개 남기기</label>
        <button id="start">${st.roundNo + 1}라운드 시작</button>
      </div>
      <p class="hint">카드를 누르고 Ctrl+V 하면 복사한 사진이 들어가요. 아무 카드도 안 고르고 Ctrl+V 하면 그 사진으로 새 항목이 생겨요. 이름은 눌러서 고쳐요.</p>
      <div class="grid">${alive.map((it) => `<div class="card ed ${it.img ? "" : "noimg"} ${selId === it.id ? "on" : ""}" data-id="${it.id}">
        <button class="x" data-del="${it.id}" title="지우기">✕</button>
        ${it.img ? `<div class="img" style="${img(it.img)}"></div>` : ""}<div class="name" contenteditable="true" data-ren="${it.id}">${esc(it.name || "")}</div></div>`).join("")}
        <div class="card add"><div class="big" style="font-size:22px">+ 추가</div><input id="addname" placeholder="이름 치고 Enter"></div></div>`;
  } else {
    const ex = r.mode === "exclude";
    const label = n === 2 && !ex ? "양자택일" : ex ? `빼고 싶은 것 ${r.picks}개 고르기` : `좋은 것 ${r.picks}개 고르기`;
    html += `<p class="sub"><b style="color:${ex ? "var(--bad)" : "var(--acc)"}">${r.n}라운드</b> · ${label} → ${r.keep}개 남김 · ${r.open ? "투표 중" : "마감"}</p>
      <div class="panel">
        <span class="big">${st.votedNums.length} / ${st.total}명</span>
        ${r.open ? `<button id="close">마감하기</button>`
                 : `<button id="next">이대로 다음 단계 (${r.proposal.survivors.length}개 남김)</button><button class="ghost" id="reopen">다시 열기</button>`}
        <button class="ghost" id="tres">${showRes ? "결과 숨기기" : "결과 보이기"}</button>
        <button class="ghost" id="twho">${showWho ? "누가 뭘 골랐나 숨기기" : "누가 뭘 골랐나 보기"}</button>
      </div>
      <div class="nums">${Array.from({ length: st.total + 1 }, (_, i) => i).map((k) => `<span class="${st.votedNums.includes(k) ? "on" : ""}">${k}</span>`).join("")}</div>`;
    if (showRes) {
      html += (!r.open ? `<p class="sub" style="margin-top:16px">✅ = 남는 항목. 줄을 누르면 남김/뺌을 바꿀 수 있어요${r.proposal.ties.length ? " (동점 있음 — 직접 골라 주세요)" : ""}.</p>` : "") + results(r);
    } else {
      html += `<p class="hidden-note">결과를 숨겼어요</p>`;
    }
    if (showWho) html += whoPicked();
  }

  if (st.history.length && showRes) {
    html += `<div class="hist"><b>지난 라운드</b><ul>` + st.history.map((h) =>
      `<li>${h.n}라운드 (${h.mode === "exclude" ? "제외" : "선택"}, ${h.voted}명): ` +
      Object.entries(h.counts).sort((a, b) => b[1] - a[1]).map(([id, c]) => `${esc((st.items.find((i) => i.id === id) || { name: "(지운 항목)" }).name)} ${c}${h.survivors.includes(id) ? "" : " ✕"}`).join(" · ") + `</li>`).join("") + `</ul></div>`;
  }
  html += `<div class="panel" style="margin-top:32px;opacity:.7"><span>아이들은 표 수를 못 봐요. 결과는 이 화면에만 보여요</span>
    ${!r && st.history.length ? `<button class="ghost" id="tres2">${showRes ? "지난 결과 숨기기" : "지난 결과 보이기"}</button>` : ""}
    <button class="ghost" id="reset">처음부터 다시</button><span class="err">${esc(err)}</span></div>`;
  app.innerHTML = html;

  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = async () => { await fn(); await load(); }; };
  on("start", () => admin("start", { mode: document.getElementById("mode").value, picks: Number(document.getElementById("picks").value), keep: Number(document.getElementById("keep").value), }));
  on("close", () => admin("close"));
  on("announce", () => admin("announce"));
  bindEdit();
  on("next", () => admin("next"));
  on("reopen", () => admin("reopen"));
  const tres = document.getElementById("tres");
  if (tres) tres.onclick = () => { showRes = !showRes; saveView(); render(); };
  const tres2 = document.getElementById("tres2");
  if (tres2) tres2.onclick = () => { showRes = !showRes; saveView(); render(); };
  const twho = document.getElementById("twho");
  if (twho) twho.onclick = () => { showWho = !showWho; saveView(); render(); };
  const rs = document.getElementById("reset");
  if (rs) rs.onclick = async () => { if (confirm("투표를 처음부터 다시 할까요? 결과가 모두 지워져요.")) { await admin("reset"); load(); } };
  app.querySelectorAll(".row.pickable").forEach((row) => row.onclick = async () => { await admin("toggle", { id: row.dataset.id }); load(); });
}

first();
// 설정 칸을 고치는 중에는 새로 그리지 않는다
setInterval(() => { if (st && st.round && key && !document.activeElement.matches("input,select")) load(); }, 2000);
</script>
</body>
</html>
